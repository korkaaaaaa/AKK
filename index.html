<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Автоконспект</title>
  <link rel="icon" type="image/x-icon" href="./static/icons/favicon.ico" />

  <style>
    :root {
      --bg: #0f1115;
      --panel: rgba(30, 34, 42, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #ffffff;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    option {
      background: #1e222a;
      color: #ffffff
    }
    body {
      position: relative;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -2;
      background:
        radial-gradient(circle at 20% 20%, rgba(101, 119, 255, 0.12), transparent 30%),
        radial-gradient(circle at 80% 25%, rgba(134, 239, 172, 0.08), transparent 28%),
        radial-gradient(circle at 50% 80%, rgba(192, 132, 252, 0.10), transparent 30%),
        linear-gradient(180deg, #0d0f14 0%, #10131a 100%);
      animation: ambientShift 12s ease-in-out infinite alternate;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(90px);
      opacity: 0.22;
      animation: floatOrb 16s ease-in-out infinite;
    }

    .orb-1 {
      width: 260px;
      height: 260px;
      background: #5b7cff;
      top: 8%;
      left: 10%;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: #8b5cf6;
      bottom: 10%;
      right: 12%;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 220px;
      height: 220px;
      background: #22c55e;
      top: 45%;
      left: 50%;
      animation-delay: -9s;
    }

    @keyframes ambientShift {
      0% {
        transform: scale(1) translateY(0);
      }
      100% {
        transform: scale(1.03) translateY(-8px);
      }
    }

    @keyframes floatOrb {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(18px, -20px) scale(1.08);
      }
      100% {
        transform: translate(-10px, 14px) scale(0.98);
      }
    }

    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 10, 14, 0.82);
      backdrop-filter: blur(10px);
      z-index: 100;
      animation: splashFadeOut 0.9s ease forwards;
      animation-delay: 2s;
    }

    .splash-content {
      text-align: center;
      padding: 24px;
      animation: splashRise 1.2s ease;
    }

    .splash h1 {
      margin: 0 0 14px;
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .splash p {
      margin: 0;
      font-size: clamp(16px, 2vw, 22px);
      color: #d4d4d8;
      max-width: 760px;
      line-height: 1.5;
    }

    @keyframes splashRise {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes splashFadeOut {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    .app {
      min-height: 100vh;
      opacity: 0;
      animation: appFadeIn 0.9s ease forwards;
      animation-delay: 2.2s;
    }

    @keyframes appFadeIn {
      to {
        opacity: 1;
      }
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 17, 21, 0.45);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 13px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      transition: 0.25s ease;
    }

    .badge:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 44px 24px 20px;
      animation: riseIn 0.8s ease both;
      animation-delay: 2.35s;
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.06;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .typing-line {
      margin-top: 18px;
      min-height: 30px;
      font-size: 18px;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .typing-prefix {
      color: var(--muted);
    }

    .typing-text {
      position: relative;
      font-weight: 500;
    }

    .typing-text::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 20px;
      background: rgba(255,255,255,0.85);
      margin-left: 6px;
      vertical-align: -3px;
      animation: blink 0.9s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px 0;
      animation: riseIn 0.8s ease both;
      animation-delay: 2.45s;
    }

    select,
    button {
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      transition: 0.25s ease;
      backdrop-filter: blur(8px);
    }

    select:hover,
    button:hover {
      background: rgba(255,255,255,0.08);
      transform: translateY(-1px);
    }

    .generate-btn {
      background: var(--accent);
      color: #111;
      font-weight: 600;
      cursor: pointer;
    }

    .generate-btn:hover {
      background: #f1f1f1;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px 26px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      min-height: 66vh;
      overflow: hidden;
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      transition: transform 0.28s ease, border-color 0.28s ease, background 0.28s ease;
      animation: riseIn 0.8s ease both;
    }

    .panel:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.14);
      background: rgba(34, 38, 47, 0.8);
    }

    .panel.left {
      animation-delay: 2.55s;
    }

    .panel.right {
      animation-delay: 2.65s;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
    }

    .panel-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .panel-body {
      padding: 18px;
      flex: 1;
      overflow: auto;
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 520px;
      resize: none;
      border: 1px solid transparent;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      line-height: 1.75;
      font-family: inherit;
      border-radius: 16px;
      padding: 10px;
      transition: 0.25s ease;
    }

    textarea:focus {
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .summary-content {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
      border-radius: 16px;
      transition: 0.25s ease;
      padding: 6px;
      outline: none;
    }

    .summary-content.editing {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .summary-content h3 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .summary-content ul {
      margin: 0;
      padding-left: 20px;
    }

    .summary-content li {
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tag {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      transition: 0.25s ease;
    }

    .tag:hover {
      color: var(--text);
      background: rgba(255,255,255,0.08);
      transform: translateY(-1px);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-1px);
    }

    .icon-btn img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      opacity: 0.9;
      pointer-events: none;
    }

    .footer-note {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 24px;
      color: var(--muted);
      font-size: 12px;
      animation: riseIn 0.8s ease both;
      animation-delay: 2.75s;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
  .workspace {
    grid-template-columns: 1fr;
    padding: 14px;
    gap: 14px;
  }

  .panel {
    min-height: auto;
    width: 100%;
  }

  .panel-body {
    padding: 14px;
    overflow-x: hidden;
  }

  textarea {
    min-height: 220px;
    font-size: 16px;
  }

  .summary-content {
    font-size: 16px;
    line-height: 1.7;
    word-break: break-word;
    overflow-wrap: break-word;
  }

  .hero p,
  .typing-line {
    font-size: 16px;
  }

  .toolbar {
    padding: 14px;
  }

  select,
  button {
    width: 100%;
  }
}
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <div class="splash">
    <div class="splash-content">
      <h1>Автоконспект</h1>
      <p>Превращает большие тексты в короткие и понятные конспекты.</p>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="logo">Автоконспект</div>
    </header>

    <section class="hero">
      <h2>Сделайте конспект за секунды</h2>
      <p>Вставьте исходный текст, выберите формат и получите готовую выжимку в нужном стиле.</p>

      <div class="typing-line">
        <span class="typing-prefix">Подходит для:</span>
        <span class="typing-text" id="typingText">научного стиля</span>
      </div>
    </section>

    <div class="toolbar">
      <select>
        <option>Научный стиль</option>
        <option selected>Простой стиль</option>
        <option>Для детей</option>
      </select>

      <select>
        <option>Абзацы</option>
        <option selected>Тезисы</option>
        <option>Список</option>
      </select>

      <select>
        <option>Сильное сжатие</option>
        <option selected>Среднее сжатие</option>
        <option>Минимальное сжатие</option>
      </select>

      <button class="generate-btn">Сделать конспект</button>
    </div>

    <main class="workspace">
      <section class="panel left">
        <div class="panel-header">
          <div class="panel-title">Исходный текст</div>
        </div>
        <div class="panel-body">
          <textarea placeholder="Вставьте сюда исходный текст..."></textarea>
        </div>
      </section>

      <section class="panel right">
        <div class="panel-header">
          <div class="panel-title">Готовый конспект</div>

          <div class="header-actions">
            <button class="icon-btn" id="copyBtn" onclick="copyText(event)" title="Копировать">
              <img src="./static/icons/notebook.ico" alt="Копировать">
            </button>

            <button class="icon-btn" id="editBtn" onclick="toggleEdit(event)" title="Редактировать">
              <img src="./static/icons/pencil.ico" alt="Редактировать">
            </button>
          </div>
        </div>

        <div class="panel-body">
          <div class="summary-content" id="summaryText" contenteditable="false">

          </div>
        </div>
      </section>
    </main>

  <script>
    const phrases = [
      "научного стиля",
      "конспектов для детей",
      "кратких тезисов",
      "делового формата",
      "подготовки к экзаменам"
    ];

    const typingText = document.getElementById("typingText");
    let phraseIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function typeEffect() {
      const current = phrases[phraseIndex];
      const visible = current.substring(0, charIndex);
      typingText.textContent = visible;

      if (!isDeleting) {
        if (charIndex < current.length) {
          charIndex++;
          setTimeout(typeEffect, 70);
        } else {
          isDeleting = true;
          setTimeout(typeEffect, 1200);
        }
      } else {
        if (charIndex > 0) {
          charIndex--;
          setTimeout(typeEffect, 35);
        } else {
          isDeleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          setTimeout(typeEffect, 300);
        }
      }
    }

    setTimeout(typeEffect, 2600);

    function copyText(event) {
      const text = document.getElementById("summaryText").innerText;
      const btn = event.currentTarget;

      navigator.clipboard.writeText(text).then(() => {
        btn.style.background = "rgba(255,255,255,0.16)";
        setTimeout(() => {
          btn.style.background = "";
        }, 450);
      });
    }

    function toggleEdit(event) {
      const el = document.getElementById("summaryText");
      const btn = event.currentTarget;

      if (el.contentEditable === "true") {
        el.contentEditable = "false";
        el.classList.remove("editing");
        btn.style.background = "";
      } else {
        el.contentEditable = "true";
        el.classList.add("editing");
        el.focus();
        btn.style.background = "rgba(255,255,255,0.12)";
      }
    }

    document.querySelector(".generate-btn").addEventListener("click", async () => {
  const text = document.querySelector("textarea").value;

  const selects = document.querySelectorAll(".toolbar select");
  const styleText = selects[0].value;
  const formatText = selects[1].value;
  const compressionText = selects[2].value;

  // Преобразуем стиль под backend
  let style = "scientific";

  if (styleText.includes("Простой")) style = "short";
  if (styleText.includes("Для детей")) style = "kids";
  if (styleText.includes("Научный")) style = "scientific";
  if (styleText.includes("Деловой")) style = "scientific"; // можно потом расширить

  try {
  const response = await fetch(
    "https://ТВОЙ-АКТУАЛЬНЫЙ-ngrok-url/summarize",
    {
      method: "POST",
      mode: "cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text: text,
        style: style,
        format: formatText,
        compression: compressionText
      })
    }
  );

  const raw = await response.text();

  console.log(raw);

  const data = JSON.parse(raw);

  if (!data.summary) {
    throw new Error("Пустой ответ");
  }

  document.getElementById("summaryText").innerHTML = `
    <div class="tags">
      <div class="tag">Стиль: ${styleText.toLowerCase()}</div>
      <div class="tag">Формат: ${formatText.toLowerCase()}</div>
      <div class="tag">Сжатие: ${compressionText.toLowerCase()}</div>
    </div>

    <h3>Краткий конспект</h3>

    <div>${data.summary.replace(/\n/g, "<br>")}</div>
  `;

} catch (err) {
  console.error(err);
  alert("Ошибка: " + err.message);
}
  console.log("STATUS:", response.status);

  const data = await response.json(); // ← обратно можно

  console.log("DATA:", data);

  if (!data || !data.summary) {
    throw new Error("Пустой ответ от сервера");
  }
  const summaryBlock = document.getElementById("summaryText");
  if (!summaryBlock) {
        console.error("Не найден элемент #summaryText");
        return;
      }
      summaryBlock.innerHTML = `
      <div class="tags">
        <div class="tag">Стиль: ${styleText.toLowerCase()}</div>
        <div class="tag">Формат: ${formatText.toLowerCase()}</div>
        <div class="tag">Сжатие: ${compressionText.toLowerCase()}</div>
      </div>

  <h3>Краткий конспект</h3>

  <div>${data.summary.replace(/\n/g, "<br>")}</div>
`;

} catch (err) {
  console.error("ОШИБКА:", err);
  alert("Ошибка обработки ответа сервера");
}
});

  </script>
</body>
</html>
